name: Research baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.cfg"
      - "Makefile"
      - "scripts/notebooks.py"
      - ".gitattributes"
      - ".github/workflows/src-baseline.yml"
      - "workspace.json"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.cfg"
      - "Makefile"
      - "scripts/notebooks.py"
      - ".gitattributes"
      - ".github/workflows/src-baseline.yml"
      - "workspace.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: src baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 3.11 is the newest version with wheels for the pinned pandas 1.5.3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Check notebooks are committed without outputs
        run: python scripts/notebooks.py check
      - name: Install the baseline's dependencies at the root pins
        run: python -m pip install -c requirements.txt pytest pytest-custom-exit-code flake8 pandas tabulate
      - name: Lint and test (no credentials, network, browser or GPU needed)
        run: make test
