name: Research baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.cfg"
      - "Makefile"
      - ".github/workflows/src-baseline.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.cfg"
      - "Makefile"
      - ".github/workflows/src-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: src baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Python 3.11 is the newest version with wheels for the pinned pandas 1.5.3.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the baseline's dependencies at the root pins
        run: python -m pip install -c requirements.txt pytest pytest-custom-exit-code flake8 pandas tabulate
      - name: Lint and test (no credentials, network, browser or GPU needed)
        run: make test
