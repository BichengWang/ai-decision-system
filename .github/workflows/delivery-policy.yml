name: Delivery policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: Delivery policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Controller regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_continual_delivery.py' -v
      - name: Changed Python syntax
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' \
            | while IFS= read -r path; do
                if [[ "$path" == *.py && -f "$path" ]]; then
                  python3 -m py_compile "$path"
                fi
              done
