name: Experiment gate CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ai-workflows/experiment-gate/**"
      - ".github/workflows/expgate-ci.yml"
  push:
    branches: [main]
    paths:
      - "ai-workflows/experiment-gate/**"
      - ".github/workflows/expgate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: ai-workflows/experiment-gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate scenarios and the example summary
        run: |
          python -m expgate.run --all-scenarios --out "$RUNNER_TEMP/expgate/scenarios"
          python -m expgate.run --input examples/offer-ranker-v2.json \
            --out "$RUNNER_TEMP/expgate/example" --require-ship
          cat "$RUNNER_TEMP/expgate/example/DECISION.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain decision records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expgate-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/expgate
          retention-days: 30
