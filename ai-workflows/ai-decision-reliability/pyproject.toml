[project]
name = "relia"
version = "0.1.5"
description = "Reliability, evaluation, and observability reference kit for real-time AI decision systems (synthetic data only)"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "scikit-learn==1.9.1"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
